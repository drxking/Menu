services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://db:27017/${MONGO_DB:-menu}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - local_uploads:/app/public/uploads
  db:
    image: mongo:8.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  mongo_data:
  local_uploads:
